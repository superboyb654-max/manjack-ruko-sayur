<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manjack Kasir</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f0fdf4;padding:10px}
.header{background:#16a34a;color:white;padding:15px;border-radius:15px;text-align:center;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center}
.card h3{font-size:14px;margin:5px 0}
.card .price{color:#16a34a;font-weight:bold;font-size:12px}
.btn{background:#16a34a;color:white;border:none;padding:10px 15px;border-radius:8px;width:100%;margin-top:8px;font-weight:bold}
.btn:active{background:#15803d}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.modal.active{display:flex}
.modal-box{background:white;border-radius:15px;padding:20px;width:100%;max-width:400px}
.qty-row{display:flex;gap:10px;margin:10px 0}
.qty-btn{width:40px;height:40px;border-radius:8px;border:1px solid #16a34a;background:white;font-size:20px}
.input-qty{flex:1;text-align:center;font-size:18px;border:2px solid #16a34a;border-radius:8px}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.quick button{background:#dcfce7;border:1px solid #16a34a;padding:6px 12px;border-radius:20px;font-size:12px}
.cart{background:white;border-radius:15px;padding:15px;margin-top:15px;position:sticky;bottom:10px}
.cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
.total{font-size:18px;font-weight:bold;color:#16a34a;margin:10px 0}
</style>
</head>
<body>
<div class="header">
<h2>🥬 MANJACK RUKO SAYUR</h2>
<p>Tanjungselor - Kasir Per Ons</p>
<p id="cartInfo">Keranjang: 0 item</p>
</div>

<div class="grid" id="productGrid"></div>

<div class="cart" id="cart">
<h3>🛒 Keranjang</h3>
<div id="cartList"><p style="color:#999;text-align:center;padding:20px">Keranjang kosong</p></div>
<div class="total">Total: <span id="totalRp">Rp 0</span></div>
<input id="bayarInput" type="number" placeholder="Uang pelanggan (Rp)" style="width:100%;padding:10px;border:2px solid #16a34a;border-radius:8px;margin:5px 0">
<div id="kembalian" style="font-weight:bold;margin:5px 0"></div>
<button class="btn" onclick="bayar()">💰 BAYAR</button>
<button class="btn" style="background:#ef4444" onclick="kosongkan()">Kosongkan</button>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<h3 id="modalName"></h3>
<p id="modalPrice" style="color:#16a34a;font-weight:bold"></p>
<div style="margin:10px 0">
<label><input type="radio" name="mode" value="ons" checked onchange="updateModal()"> Per Ons</label>
<label style="margin-left:15px"><input type="radio" name="mode" value="kg" onchange="updateModal()"> Per Kg</label>
</div>
<div class="qty-row">
<button class="qty-btn" onclick="changeQty(-1)">-</button>
<input class="input-qty" id="qtyInput" type="number" value="1" min="1" oninput="updateModal()">
<button class="qty-btn" onclick="changeQty(1)">+</button>
</div>
<div class="quick">
<button onclick="setQty(1)">1 ons</button>
<button onclick="setQty(2)">2 ons</button>
<button onclick="setQty(5)">5 ons</button>
<button onclick="setQty(7)">7 ons</button>
<button onclick="setQty(10)">10 ons=1kg</button>
<button onclick="setQty(20)">20 ons=2kg</button>
</div>
<div id="konversi" style="background:#f0fdf4;padding:10px;border-radius:8px;margin:10px 0;font-weight:bold;text-align:center"></div>
<div id="modalTotal" style="font-size:20px;font-weight:bold;color:#16a34a;text-align:center;margin:10px 0"></div>
<button class="btn" onclick="addToCart()">Tambah ke Keranjang</button>
<button class="btn" style="background:#999;margin-top:5px" onclick="closeModal()">Batal</button>
</div>
</div>

<script>
const products=[
{id:1,name:'Kangkung',price:20000,emoji:'🌿'},
{id:2,name:'Bayam',price:18000,emoji:'🍃'},
{id:3,name:'Sawi Hijau',price:22000,emoji:'🥬'},
{id:4,name:'Sawi Putih',price:20000,emoji:'🥬'},
{id:5,name:'Tomat',price:25000,emoji:'🍅'},
{id:6,name:'Cabe Merah',price:60000,emoji:'🌶️'},
{id:7,name:'Cabe Rawit',price:80000,emoji:'🌶️'},
{id:8,name:'Bawang Merah',price:35000,emoji:'🧅'}
];
let cart=[];
let currentProduct=null;
function renderProducts(){
const grid=document.getElementById('productGrid');
grid.innerHTML=products.map(p=>`
<div class="card">
<div style="font-size:30px">${p.emoji}</div>
<h3>${p.name}</h3>
<div class="price">Rp ${p.price.toLocaleString()}/kg</div>
<div style="font-size:11px;color:#666">Rp ${(p.price/10).toLocaleString()}/ons</div>
<button class="btn" onclick="openModal(${p.id})">Pilih</button>
</div>
`).join('');
}
function openModal(id){
currentProduct=products.find(p=>p.id===id);
document.getElementById('modalName').innerText=currentProduct.name;
document.getElementById('modalPrice').innerText=`Rp ${currentProduct.price.toLocaleString()}/kg = Rp ${(currentProduct.price/10).toLocaleString()}/ons`;
document.getElementById('qtyInput').value=1;
updateModal();
document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active');}
function changeQty(d){
let v=parseInt(document.getElementById('qtyInput').value)||1;
v+=d; if(v<1)v=1; document.getElementById('qtyInput').value=v; updateModal();
}
function setQty(v){document.getElementById('qtyInput').value=v; updateModal();}
function updateModal(){
if(!currentProduct)return;
let qty=parseInt(document.getElementById('qtyInput').value)||1;
let mode=document.querySelector('input[name="mode"]:checked').value;
let gram,kg,total,ons;
if(mode==='ons'){
ons=qty; gram=ons*100; kg=ons/10; total=(currentProduct.price/10)*ons;
document.getElementById('konversi').innerHTML=`${ons} ons = ${gram} gram = ${kg} kg`;
}else{
kg=qty; ons=kg*10; gram=kg*1000; total=currentProduct.price*kg;
document.getElementById('konversi').innerHTML=`${kg} kg = ${ons} ons = ${gram} gram`;
}
document.getElementById('modalTotal').innerText=`Rp ${total.toLocaleString()}`;
}
function addToCart(){
let qty=parseInt(document.getElementById('qtyInput').value)||1;
let mode=document.querySelector('input[name="mode"]:checked').value;
let ons,kg,gram,total;
if(mode==='ons'){ons=qty; kg=ons/10; gram=ons*100; total=(currentProduct.price/10)*ons;}
else{kg=qty; ons=kg*10; gram=kg*1000; total=currentProduct.price*kg;}
cart.push({name:currentProduct.name,ons,kg,gram,total,price:currentProduct.price});
closeModal(); renderCart();
}
function renderCart(){
const list=document.getElementById('cartList');
if(cart.length===0){list.innerHTML='<p style="color:#999;text-align:center;padding:20px">Keranjang kosong</p>';}
else{
list.innerHTML=cart.map((c,i)=>`
<div class="cart-item">
<div><b>${c.name}</b><br><small>${c.ons} ons (${c.gram}gr) = ${c.kg}kg</small></div>
<div style="text-align:right">Rp ${c.total.toLocaleString()}<br><button onclick="hapus(${i})" style="color:red;border:none;background:none">hapus</button></div>
</div>
`).join('');
}
let total=cart.reduce((s,c)=>s+c.total,0);
document.getElementById('totalRp').innerText='Rp '+total.toLocaleString();
document.getElementById('cartInfo').innerText=`Keranjang: ${cart.length} item | Rp ${total.toLocaleString()}`;
updateKembalian();
}
function hapus(i){cart.splice(i,1);renderCart();}
function kosongkan(){cart=[];renderCart();document.getElementById('bayarInput').value='';document.getElementById('kembalian').innerText='';}
function updateKembalian(){
let total=cart.reduce((s,c)=>s+c.total,0);
let bayar=parseInt(document.getElementById('bayarInput').value)||0;
if(bayar>0){
let kembali=bayar-total;
document.getElementById('kembalian').innerText=kembali>=0?`Kembalian: Rp ${kembali.toLocaleString()}`:`Kurang: Rp ${Math.abs(kembali).toLocaleString()}`;
document.getElementById('kembalian').style.color=kembali>=0?'green':'red';
}
}
document.getElementById('bayarInput').addEventListener('input',updateKembalian);
function bayar(){
if(cart.length===0){alert('Keranjang kosong Bos!');return;}
let total=cart.reduce((s,c)=>s+c.total,0);
let bayarVal=parseInt(document.getElementById('bayarInput').value)||0;
if(bayarVal<total){alert('Uang kurang Bos!');return;}
let kembali=bayarVal-total;
let struk=`MANJACK RUKO SAYUR\nTanjungselor\n\n`+cart.map(c=>`${c.name} ${c.ons}ons(${c.gram}gr) Rp${c.total.toLocaleString()}`).join('\n')+`\n\nTotal: Rp${total.toLocaleString()}\nBayar: Rp${bayarVal.toLocaleString()}\nKembalian: Rp${kembali.toLocaleString()}\n\nTerima kasih Bos!`;
alert(struk);
if(confirm('Kirim struk via WA?')){window.open('https://wa.me/?text='+encodeURIComponent(struk));}
kosongkan();
}
renderProducts();
</script>
</body>
</html>
